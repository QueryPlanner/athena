# systemd drop-in for the otelcol-contrib.service shipped by the .deb.
# Installed to /etc/systemd/system/otelcol-contrib.service.d/athena.conf by
# scripts/setup-host.sh, so the packaged unit stays untouched.
[Unit]
After=network-online.target openobserve.service
Wants=network-online.target

[Service]
# OPENOBSERVE_OTLP_ENDPOINT and OPENOBSERVE_AUTH for deploy/otel/config.yaml.
EnvironmentFile=/etc/otelcol-contrib/openobserve.env
MemoryMax=256M
