<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in for Athena</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --line: #d6d6d0; --accent: #2f5bd3; --ok: #1f7a4a; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #34342f; --accent: #7d9cff; --ok: #5fc48d; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 32px; background: var(--bg); color: var(--fg);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: var(--muted); }
  form, .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  input[type=text], input[type=password], input[type=url] { flex: 1 1 180px; min-width: 0; padding: 9px 10px;
         border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: inherit; }
  button { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
           color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  #screen { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px;
            cursor: crosshair; touch-action: manipulation; min-height: 120px; }
  #status { min-height: 1.4em; margin: 6px 0; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
</style>
</head>
<body>
<h1>Sign in for Athena</h1>
<p>This is Athena's browser. Tap the page to click, type below, then press Done. Athena never sees what you type here.</p>
<form id="go"><input id="url" type="url" placeholder="https://…" autocomplete="off"><button>Go</button></form>
<img id="screen" alt="The browser's page">
<div id="status"></div>
<form id="typing">
  <input id="text" type="text" placeholder="Text to type into the selected field" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label><input id="hide" type="checkbox"> hide</label>
  <button>Type</button>
</form>
<div class="row">
  <button data-key="Enter">Enter</button><button data-key="Tab">Tab</button>
  <button data-key="Backspace">⌫</button><button data-key="Escape">Esc</button>
  <button data-scroll="up">▲</button><button data-scroll="down">▼</button>
</div>
<div class="row"><button id="done" class="primary">Done, save sign-in</button></div>
<script>
  const base = location.pathname.replace(/\/+$/, "");
  const screen = document.getElementById("screen");
  const status = document.getElementById("status");
  function show(text, kind) { status.textContent = text; status.className = kind || ""; }
  async function post(action, body) {
    const response = await fetch(base + "/" + action, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}),
    });
    const json = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error((json.error && json.error.message) || "HTTP " + response.status);
    return json;
  }
  // One action at a time, in the order the user made them: typing must not
  // overtake the tap that focuses the field.
  let queue = Promise.resolve();
  function act(action, body) {
    queue = queue.then(() => post(action, body)).then(() => show(""), (e) => show(e.message, "bad"));
    return queue;
  }
  // A failed poll's error is cleared by the next good one; an expired link
  // stops the polling.
  let pollFailed = false;
  async function refresh() {
    try {
      const response = await fetch(base + "/screen", { cache: "no-store" });
      if (response.ok) {
        const url = URL.createObjectURL(await response.blob());
        screen.onload = () => URL.revokeObjectURL(url);
        screen.src = url;
        if (pollFailed) { pollFailed = false; show(""); }
      } else {
        const json = await response.json().catch(() => ({}));
        pollFailed = true;
        show((json.error && json.error.message) || "HTTP " + response.status, "bad");
        if (response.status === 404) return;
      }
    } catch (e) { pollFailed = true; show(e.message, "bad"); }
    setTimeout(refresh, 1000);
  }
  screen.addEventListener("click", (e) => {
    if (!screen.naturalWidth) return;
    const box = screen.getBoundingClientRect();
    const x = Math.round((e.clientX - box.left) * screen.naturalWidth / box.width);
    const y = Math.round((e.clientY - box.top) * screen.naturalHeight / box.height);
    act("click", { x, y });
  });
  document.getElementById("typing").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    if (input.value) { act("type", { text: input.value }); input.value = ""; }
  });
  document.getElementById("hide").addEventListener("change", (e) => {
    document.getElementById("text").type = e.target.checked ? "password" : "text";
  });
  document.getElementById("go").addEventListener("submit", (e) => {
    e.preventDefault();
    act("open", { url: document.getElementById("url").value });
  });
  document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => act("press", { key: b.dataset.key })));
  document.querySelectorAll("[data-scroll]").forEach((b) => b.addEventListener("click", () => act("scroll", { direction: b.dataset.scroll })));
  document.getElementById("done").addEventListener("click", () => {
    show("Saving…");
    queue = queue.then(() => post("done")).then(
      () => show("Saved. Go back to the chat and tell Athena you're done.", "ok"),
      (e) => show(e.message, "bad"),
    );
  });
  post("start").catch((e) => show(e.message, "bad")).finally(refresh);
</script>
</body>
</html>
