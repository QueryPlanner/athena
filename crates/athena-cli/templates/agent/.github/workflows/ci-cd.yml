# CI/CD for the @NAME@ agent, made by `athena-cli new`. The same pipeline as
# Athena's: the VM only ever pulls what this workflow built.
#
#   pull_request   fmt, clippy, tests, release build
#   push main      build (release artifact to GHCR) -> deploy-staging + smoke
#   push tag v*    require-stage-success -> deploy-prod + smoke
#
# Every action is pinned to a commit SHA, permissions are minimal per job,
# and fork PRs get no secrets and never reach the tailnet.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  ORAS_VERSION: 1.3.4
  ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
  ARTIFACT_TYPE: application/vnd.athena.release.v1

jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked && ./target/release/athena --version

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Older glibc than the VM's Ubuntu 24.04, so the binary runs on both.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release build
        run: cargo build --release --locked --bin athena
      - name: Install oras (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tgz" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tgz" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
      - name: Push the release artifact
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd target/release
          ./athena --version
          oras push "$repo:sha-$GITHUB_SHA" \
            --artifact-type "$ARTIFACT_TYPE" \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --format json \
            athena:application/octet-stream >"$RUNNER_TEMP/push.json"
          digest=$(jq -r .digest "$RUNNER_TEMP/push.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "Pushed \`$repo:sha-$GITHUB_SHA\` = \`$digest\`" >>"$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          commands: |
            deploy staging ${{ needs.build.outputs.digest }}
            smoke staging
          host: ${{ vars.VM_HOST }}
          known-hosts: ${{ vars.VM_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ts-authkey: ${{ secrets.TS_AUTH_KEY }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

  require-stage-success:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      repo: ${{ steps.resolve.outputs.repo }}
    steps:
      - name: The tagged commit's main run must be green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-cd.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success" --jq .total_count)
          if [ "$runs" -lt 1 ]; then
            echo "::error::no successful push-to-main run of ci-cd.yml for $GITHUB_SHA"
            exit 1
          fi
      - name: Install oras (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tgz" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tgz" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
      - name: Resolve the artifact staging tested
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=$(oras resolve "$repo:sha-$GITHUB_SHA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::cannot resolve $repo:sha-$GITHUB_SHA"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "repo=$repo" >>"$GITHUB_OUTPUT"

  deploy-prod:
    needs: require-stage-success
    runs-on: ubuntu-24.04
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oras (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tgz" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tgz" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
      - name: Name the release (same bytes, new tag)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.require-stage-success.outputs.repo }}
          DIGEST: ${{ needs.require-stage-success.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[A-Za-z0-9._-]{1,127}$ ]] || { echo "::error::'$GITHUB_REF_NAME' is not a valid OCI tag"; exit 1; }
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras tag "$REPO@$DIGEST" "$GITHUB_REF_NAME"
      - name: Promote to prod, then smoke-prod
        uses: ./.github/actions/gate
        with:
          commands: |
            promote prod ${{ needs.require-stage-success.outputs.digest }}
            smoke prod
          host: ${{ vars.VM_HOST }}
          known-hosts: ${{ vars.VM_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ts-authkey: ${{ secrets.TS_AUTH_KEY }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
