[package]
name = "athena"
version = "0.2.0"
edition = "2024"
# `cargo run` means the agent; deploy-gate runs only on the VM.
default-run = "athena"

# A tiny stdio MCP server for tests/mcp.rs. It is a bin because that is how
# Cargo hands an integration test the path of a built program.
[[bin]]
name = "athena-mcp-fixture"
path = "tests/mcp/fixture.rs"
test = false
doc = false

[dependencies]
anyhow = "1.0.104"
# URL-safe base64, to decode GOOGLE_HEALTH_TOKEN_ENCRYPTION_KEY (a Fernet key)
# and to encode the PKCE challenge. The version Cargo.lock already holds.
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
# Encrypts the stored Google Health refresh token (src/health.rs).
chacha20poly1305 = "0.10.1"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Time zones and DST for each user's local time (src/timezone.rs). Default
# features read the system tzdb (/usr/share/zoneinfo); `tzdb-bundle-always`
# embeds a copy that is used only when the host has none.
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
libc = "0.2.189"
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = "0.33.0"
opentelemetry-http = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "logs"] }
# Parses the model's Markdown for Telegram (src/telegram/render.rs). Only the
# parser is used, so the HTML renderer and the CLI option parser stay off.
pulldown-cmark ={ version = "0.13.4", default-features = false }
regex = "1.13.1"
# The same version and features teloxide already builds, so no new code is compiled.
# Used by the sandbox client, evals and bench.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rig-agent = { version = "0.42.0", features = ["derive", "rmcp"] }
rig-core = "0.42.0"
# MCP client for mcp.json servers. Rig needs major 2. Two transports: stdio
# (child process) and streamable HTTP, whose reqwest 0.13 is already built for
# OpenTelemetry and Rig, so it adds one small crate (sse-stream).
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "std", "ansi"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
# `multipart` lets the fake OpenSandbox in tests/ parse file uploads.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "multipart", "query"] }
http-body-util = "0.1.5"
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "logs", "testing"] }
# Same crate and version as above, plus Rig's scripted mock model for tests.
rig-core = { version = "0.42.0", features = ["test-utils"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
