[package]
name = "athena"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rig-agent = { version = "0.42.0", features = ["derive"] }
rig-core = "0.42.0"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
http-body-util = "0.1.5"
# Same crate and version as above, plus Rig's scripted mock model for tests.
rig-core = { version = "0.42.0", features = ["test-utils"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
